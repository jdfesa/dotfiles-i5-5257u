[main]
font=JetBrainsMono Nerd Font Mono:size=10
use-bold=no
prompt="Run> "
fields=filename,name,generic,keywords
terminal=kitty --override=tab_bar_min_tabs=2 -e
lines=10
width=42
horizontal-pad=16
vertical-pad=12
inner-pad=8
layer=overlay

[colors]
background=1e1e2eff
text=cdd6f4ff
prompt=b4befeff
input=cdd6f4ff
match=b4befeff
selection=45475aff
selection-text=cdd6f4ff
selection-match=b4befeff
border=b4befeff

[border]
width=2
radius=0
