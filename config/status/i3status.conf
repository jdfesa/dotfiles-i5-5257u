# Native status blocks: no shell command is spawned for each refresh.
general {
    output_format = "i3bar"
    colors = true
    color_good = "#cdd6f4"
    color_degraded = "#f9e2af"
    color_bad = "#f38ba8"
    interval = 10
}

order += "read_file weather"
order += "memory"
order += "cpu_usage"
order += "cpu_temperature 0"
order += "disk /"
order += "read_file updates"
order += "volume master"
order += "wireless _first_"
order += "battery all"
order += "tztime local"

cpu_temperature 0 {
    format = "%degrees°C"
    path = "/home/jd/.cache/mbp-sway/cpu-temperature"
    max_threshold = 80
}

cpu_usage {
    format = "%usage"
}

memory {
    format = "%percentage_used"
    decimals = 0
    memory_used_method = "memavailable"
    threshold_degraded = "10%"
    threshold_critical = "5%"
}

disk "/" {
    format = "%avail"
    prefix_type = "custom"
    low_threshold = 10
    threshold_type = "percentage_avail"
}

wireless _first_ {
    # Internal quality only: status-clicks.py replaces it with a signal icon.
    format_up = "%quality"
    format_down = "down"
    format_quality = "%d%s"
}

battery all {
    format = "%status %percentage"
    format_down = "No battery"
    format_percentage = "%.0f%s"
    status_chr = "BAT+"
    status_bat = "BAT"
    status_full = "BAT"
    status_unk = "BAT?"
    last_full_capacity = true
    low_threshold = 15
    threshold_type = "percentage"
}

read_file weather {
    path = "/home/jd/.cache/mbp-sway/weather.txt"
    format = "%content"
    format_bad = "☁ --°C"
}

read_file updates {
    path = "/home/jd/.cache/mbp-sway/updates.txt"
    format = "%content"
    format_bad = "?"
}

volume master {
    format = "%volume"
    format_muted = "muted %volume"
    device = "default"
    mixer = "Master"
    mixer_idx = 0
}

tztime local {
    format = "%a %b %d %H:%M"
}
