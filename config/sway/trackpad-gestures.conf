# MacBookPro12,1 internal ISO trackpad (Apple USB 05ac:0273).
# Reserve only horizontal four-finger swipes for the focused output.
bindgesture --exact --input-device=1452:627:bcm5974 swipe:4:left workspace next_on_output
bindgesture --exact --input-device=1452:627:bcm5974 swipe:4:right workspace prev_on_output
