# Debian 13 / Iris 6100: native Wayland in Sway, X11 available in recovery XFCE.
linux_display_server auto
shell /usr/bin/zsh --login
font_family JetBrainsMono Nerd Font Mono
font_size 10.0
include theme.conf

# Static, opaque baseline. Do not import macOS/Ghostty effects or sessions.
background_opacity 1.0
background_blur 0
cursor_trail 0
cursor_blink_interval 0
scrollback_lines 10000
window_padding_width 6
enable_audio_bell no
allow_remote_control no

# Match the existing terminal's immediate Super+W close behavior.
# Power/logout confirmation remains the responsibility of the Sway helpers.
confirm_os_window_close 0
kitty_mod ctrl+shift

# Native workspace labels: display only the active directory's basename.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style angled
tab_bar_min_tabs 1
tab_title_template "{(tab.active_wd or title).rstrip('/').rsplit('/', 1)[-1] or '/'}"
map kitty_mod+t new_tab_with_cwd
map super+shift+t new_tab_with_cwd
