[Service]
RuntimeDirectory=mbp-lid-poweroff
RuntimeDirectoryMode=0700
# A missing/failed guard must not prevent ordinary suspend.
ExecStartPre=-/usr/bin/python3 -I /usr/local/libexec/mbp-lid-poweroff.py --prepare-suspend
ExecStopPost=-/usr/bin/python3 -I /usr/local/libexec/mbp-lid-poweroff.py --finish-suspend
